name: Worker auth presence probe

on:
  push:
    branches:
      - agentic/439-worker-router
    paths:
      - .github/workflows/worker-auth-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
      HAS_CODEX_API_KEY: ${{ secrets.CODEX_API_KEY != '' }}
      HAS_COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Report secret presence only
        shell: bash
        run: |
          echo "OPENAI_API_KEY present: ${HAS_OPENAI_API_KEY}"
          echo "CODEX_API_KEY present: ${HAS_CODEX_API_KEY}"
          echo "COPILOT_GITHUB_TOKEN present: ${HAS_COPILOT_GITHUB_TOKEN}"
          echo "ANTHROPIC_API_KEY present: ${HAS_ANTHROPIC_API_KEY}"
          echo "GEMINI_API_KEY present: ${HAS_GEMINI_API_KEY}"
          echo "No secret values are read or printed by this workflow."
