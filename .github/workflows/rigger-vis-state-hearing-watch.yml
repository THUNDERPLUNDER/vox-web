name: rigger-vis-state-hearing-watch

on:
  push:
    branches:
      - vis-state
    paths:
      - .github/workflows/rigger-vis-state-hearing-watch.yml

permissions:
  contents: write

jobs:
  patch-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vis-state
          fetch-depth: 0
      - name: Patch approved WATCH state only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/state/vis-roadmap-projection-v02.json')
          data = json.loads(path.read_text())
          if data['projectionRevision'] != '2026-09-13.2':
              raise SystemExit(f"Unexpected projection revision: {data['projectionRevision']}")

          data['projectionRevision'] = '2026-09-13.3'
          for ref in ['#404', '#405']:
              if ref not in data['provenance']:
                  data['provenance'].append(ref)

          signal = {
              'id': 'hearing-landscape',
              'title': 'Hørselslandskap i endring',
              'note': 'Politikk · kapasitet · arbeidsdeling · eldrebølge · offentlig digital førstelinje',
              'evidenceLabel': 'Verifisert retning · gjennomføring fortsatt åpen',
              'lastVerified': '2026-09-11',
              'sourceIssues': [404],
              'sourceLinks': [
                  {
                      'label': 'Helsepersonellplan 2040',
                      'href': 'https://www.regjeringen.no/contentassets/6d2ec1946c744942a24cb528ca666ae0/no/pdfs/stm202520260011000dddpdfs.pdf',
                  }
              ],
              'detail': {
                  'verified': 'Regjeringen vil etablere en trygg offentlig KI-basert digital førstelinje via Helsenorge. Planen beskriver også samarbeid med næringslivet og kjøp av kvalitetssikrede løsninger i markedet.',
                  'open': 'Innkjøpsform, finansiering, godkjenningsmodell, integrasjonspunkter og tidslinje er ikke avklart. Konsekvensen for Viddels posisjon er derfor fortsatt WATCH.',
                  'trigger': 'Et konkret program, en anskaffelse, partnerskapsmodell, refusjonsordning, sertifiseringsvei eller et åpent integrasjonspunkt som kan endre Viddels marked eller roadmap.',
              },
          }
          existing = [item for item in data['watchSignals'] if item['id'] != signal['id']]
          data['watchSignals'] = existing + [signal]
          if signal['id'] not in data['frontPreview']['watch']:
              data['frontPreview']['watch'].append(signal['id'])

          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Commit state-only update and remove executor
        run: |
          rm .github/workflows/rigger-vis-state-hearing-watch.yml
          git config user.name "rigger"
          git config user.email "actions@users.noreply.github.com"
          git add docs/state/vis-roadmap-projection-v02.json .github/workflows/rigger-vis-state-hearing-watch.yml
          git commit -m "VIS state: add hearing-landscape WATCH"
          git push origin HEAD:vis-state
