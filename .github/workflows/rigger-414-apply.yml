name: rigger-414-apply

on:
  push:
    branches:
      - rigger/414-dynamic-roadmap-v02

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rigger/414-dynamic-roadmap-v02
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply bounded #414 patch
        run: python3 scripts/rigger-apply-414.py

      - name: Install
        run: npm ci

      - name: Verify roadmap contract
        run: npm run verify:vis-roadmap-horizons

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit verified implementation and remove one-off executor
        run: |
          rm scripts/rigger-apply-414.py
          rm .github/workflows/rigger-414-apply.yml
          git config user.name "rigger"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "#414 wire dynamic approved roadmap state into VIS"
          git push origin HEAD:rigger/414-dynamic-roadmap-v02
