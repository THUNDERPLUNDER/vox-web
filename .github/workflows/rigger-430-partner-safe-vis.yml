name: rigger-430-partner-safe-vis
on:
  push:
    paths:
      - '.github/workflows/rigger-430-partner-safe-vis.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rigger/414-dynamic-roadmap-v02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make VIS meeting-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/data/vis-project-state-v01.ts'): [
                  ('projectionOwner: "Thomas"', 'projectionOwner: "Viddel"'),
                  ('Markedsklar-sporet er aktivert med NoA / Kristine Hoff som foretrukket designpartner', 'Markedsklar-sporet er aktivert med valgt designpartner'),
                  ('Bekreft kapasitet og periode med NoA / Kristine, signer samarbeidsavtalen', 'Bekreft kapasitet og periode med valgt designpartner, signer samarbeidsavtalen'),
                  ('Sørg for at mennesker som møter Thomas, Vibeke eller Viddel på nett forstår det samme prosjektet', 'Sørg for at mennesker som møter Viddel gjennom teamet, på nett eller i materiell, forstår det samme prosjektet'),
                  ('title: "NoA / Kristine er valgt for Markedsklar"', 'title: "Designpartner er valgt for Markedsklar"'),
                  ('Viddel ønsker å gjennomføre Markedsklar med Kristine Hoff / NoA, med endelig kapasitet og periode', 'Viddel ønsker å gjennomføre Markedsklar med valgt designpartner, med endelig kapasitet og periode'),
                  ('Få NoA / Kristine kapasitet og periode bekreftet', 'Få designpartnerens kapasitet og periode bekreftet'),
              ],
              Path('src/data/vis-roadmap-horizons-v01.ts'): [
                  ('title: "NoA / Kristine + Markedsklar"', 'title: "Designpartner + Markedsklar"'),
                  ('title: "NoA / DOGA: kapasitet, periode og formell vei"', 'title: "Markedsklar / DOGA: kapasitet, periode og formell vei"'),
                  ('"doga-markedsklar": "Få Markedsklar med NoA / Kristine formelt på plass"', '"doga-markedsklar": "Få Markedsklar med designpartner formelt på plass"'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - run: npm ci
      - run: npm run verify:vis-roadmap-horizons
      - run: npm run build
      - run: git diff --check
      - name: Commit verified meeting-safe surface
        run: |
          git config user.name "THUNDERPLUNDER"
          git config user.email "140942800+THUNDERPLUNDER@users.noreply.github.com"
          git add src/data/vis-project-state-v01.ts src/data/vis-roadmap-horizons-v01.ts
          git commit -m "#430 make VIS partner-safe by role"
          git rm .github/workflows/rigger-430-partner-safe-vis.yml
          git commit -m "#430 remove one-off partner-safe executor"
          git push origin HEAD:rigger/414-dynamic-roadmap-v02
