name: Compile gh-aw pilot

on:
  push:
    branches:
      - agentic/437-claude-dispatch-pilot
    paths:
      - .github/workflows/claude-issue-dispatch.md
      - .github/workflows/compile-gh-aw-pilot.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.88.4
        with:
          version: v0.88.4

      - name: Compile reviewed agentic workflow
        run: gh aw compile --approve .github/workflows/claude-issue-dispatch.md

      - name: Stage compiled lockfile as Git blob only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          p = Path('.github/workflows/claude-issue-dispatch.lock.yml')
          payload = {
              'content': base64.b64encode(p.read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }
          Path('/tmp/gh-aw-lock-blob.json').write_text(json.dumps(payload))
          PY
          blob_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/gh-aw-lock-blob.json --jq .sha)"
          echo "GH_AW_LOCK_BLOB_SHA=${blob_sha}"
          echo "GH_AW_LOCK_SHA256=$(sha256sum .github/workflows/claude-issue-dispatch.lock.yml | awk '{print $1}')"

      - name: Upload compiled lockfile as short-lived audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-issue-dispatch-lock
          path: .github/workflows/claude-issue-dispatch.lock.yml
          if-no-files-found: error
          retention-days: 1
