name: Compile gh-aw pilot

on:
  push:
    branches:
      - agentic/437-claude-dispatch-pilot
    paths:
      - .github/workflows/claude-issue-dispatch.md

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.88.4
        with:
          version: v0.88.4

      - name: Compile agentic workflow
        run: gh aw compile .github/workflows/claude-issue-dispatch.md

      - name: Commit compiled lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/claude-issue-dispatch.lock.yml
          if git diff --staged --quiet; then
            echo "No compiled changes."
          else
            git commit -m "chore(agentic): compile Claude dispatch workflow"
            git push
          fi
