name: Compile gh-aw pilot

on:
  push:
    branches:
      - agentic/437-claude-dispatch-pilot
    paths:
      - .github/workflows/claude-issue-dispatch.md
      - .github/workflows/compile-gh-aw-pilot.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Install pinned gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.88.4
        with:
          version: v0.88.4

      - name: Compile reviewed agentic workflow
        run: gh aw compile --approve .github/workflows/claude-issue-dispatch.md

      - name: Upload compiled lockfile for reviewed write-back
        uses: actions/upload-artifact@v4
        with:
          name: claude-issue-dispatch-lock
          path: .github/workflows/claude-issue-dispatch.lock.yml
          if-no-files-found: error
          retention-days: 1
