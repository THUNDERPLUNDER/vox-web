  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;style&gt;
    #conversation-layout-verification {
      color: var(--foreground);
      width: 100%;
    }

    #conversation-layout-verification * {
      box-sizing: border-box;
    }

    #conversation-layout-verification .prototype-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    #conversation-layout-verification .control-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    #conversation-layout-verification .prototype {
      position: relative;
      overflow: hidden;
      min-height: 560px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--background);
    }

    #conversation-layout-verification .product-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    #conversation-layout-verification .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    #conversation-layout-verification .desktop-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0fr;
      min-height: 508px;
      transition: grid-template-columns 260ms ease;
    }

    #conversation-layout-verification .prototype.is-active .desktop-stage {
      grid-template-columns: minmax(240px, 34%) minmax(0, 66%);
    }

    #conversation-layout-verification .overview-pane {
      min-width: 0;
      padding: 24px;
      transition: padding 260ms ease;
    }

    #conversation-layout-verification .prototype.is-active .overview-pane {
      padding: 18px;
      border-right: 1px solid var(--border);
    }

    #conversation-layout-verification .overview-inner {
      width: min(100%, 720px);
      margin: 0 auto;
      transition: width 260ms ease, margin 260ms ease;
    }

    #conversation-layout-verification .prototype.is-active .overview-inner {
      width: 100%;
      margin: 0;
    }

    #conversation-layout-verification .overview-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    #conversation-layout-verification .overview-heading h2,
    #conversation-layout-verification .chat-heading h2 {
      margin: 0;
    }

    #conversation-layout-verification .overview-heading p,
    #conversation-layout-verification .chat-heading p {
      margin: 4px 0 0;
    }

    #conversation-layout-verification .prototype.is-active .overview-subtitle {
      display: none;
    }

    #conversation-layout-verification .prototype.is-active .overview-heading {
      align-items: center;
      margin-bottom: 10px;
    }

    #conversation-layout-verification .conversation-list {
      display: grid;
      gap: 0;
    }

    #conversation-layout-verification .day-cluster {
      display: grid;
      min-width: 0;
      justify-items: stretch;
      gap: 14px;
    }

    #conversation-layout-verification .day-cluster + .day-cluster {
      margin-top: 30px;
    }

    #conversation-layout-verification .conversation-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
      inline-size: 100%;
      justify-content: stretch;
      justify-self: stretch;
      margin-inline: 0;
      padding: 10px 12px;
      text-align: left;
      white-space: normal;
    }

    #conversation-layout-verification .conversation-date-block,
    #conversation-layout-verification .conversation-content,
    #conversation-layout-verification .conversation-heading-row {
      min-width: 0;
    }

    #conversation-layout-verification .conversation-date-block {
      color: var(--muted-foreground);
    }

    #conversation-layout-verification .conversation-item.is-repeat-date .conversation-day {
      display: none;
    }

    #conversation-layout-verification .conversation-content {
      display: grid;
      gap: 3px;
    }

    #conversation-layout-verification .conversation-heading-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    #conversation-layout-verification .conversation-title {
      display: -webkit-box;
      min-width: 0;
      overflow: hidden;
      font-weight: 500;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

    #conversation-layout-verification .empty-history {

      justify-items: center;
      gap: 16px;

      display: none;

    #conversation-layout-verification .prototype.is-empty-history .empty-history {

    }

    #conversation-layout-verification .prototype.is-empty-history .overview-heading .new-conversation {
      display: none;
    }

    #conversation-layout-verification .conversation-preview {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #conversation-layout-verification .conversation-origin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    #conversation-layout-verification .date-group {

      margin: 8px 0 0;
      color: var(--muted-foreground);
      font-weight: 500;
    }

    #conversation-layout-verification .date-group:first-child {
      margin-top: 0;
    }

    #conversation-layout-verification .prototype.is-active .conversation-preview {
      display: none;
    }

    #conversation-layout-verification .prototype.density-title-only .conversation-preview {
      display: none;
    }

    #conversation-layout-verification .variant-a .conversation-date-block {

      gap: 6px;

    #conversation-layout-verification .variant-a .conversation-time-inline {
      display: none;
    }

    #conversation-layout-verification .variant-b .conversation-item {

      align-items: start;
      gap: 16px;

    #conversation-layout-verification .variant-b .conversation-date-block {

      gap: 2px;

    #conversation-layout-verification .variant-b .conversation-time-inline {
      display: none;
    }

    #conversation-layout-verification .variant-c .date-group {
      display: block;
    }

    #conversation-layout-verification .variant-c .conversation-date-block {
      display: none;
    }

    #conversation-layout-verification .variant-c .conversation-item {

    }

    #conversation-layout-verification .prototype.is-active .conversation-list {
      gap: 0;

    #conversation-layout-verification .prototype.is-active .conversation-content {

      gap: 3px;

    }

    }

      #conversation-layout-verification .overview-pane,
      #conversation-layout-verification .overview-inner,

        transition: none;
      }

        emptyButton.setAttribute(&#x27;aria-pressed&#x27;, String(isEmptyHistory));
        emptyButton.classList.toggle(&#x27;btn-primary&#x27;, isEmptyHistory);

        root.querySelectorAll(&#x27;.conversation-item&#x27;).forEach((item) =&gt; {
          item.setAttribute(&#x27;aria-pressed&#x27;, String(!isNew &amp;&amp; item.dataset.conversation === selected));
        });

        const current = conversations[selected];
        const title = isNew ? &#x27;Ny samtale&#x27; : current.title;
        const context = isNew ? &#x27;&#x27; : current.origin;
        root.querySelector(&#x27;#desktop-overview-title&#x27;).textContent = isActive ? &#x27;Samtaler&#x27; : &#x27;Samtalene dine&#x27;;
        root.querySelector(&#x27;#desktop-chat-title&#x27;).textContent = title;
        root.querySelector(&#x27;#desktop-chat-context&#x27;).textContent = context;
        root.querySelector(&#x27;#desktop-chat-context&#x27;).hidden = !context;
        root.querySelector(&#x27;#mobile-chat-title&#x27;).textContent = title;
        root.querySelector(&#x27;#mobile-chat-context&#x27;).textContent = context;
        root.querySelector(&#x27;#mobile-chat-context&#x27;).hidden = !context;

        mobileOverview.classList.toggle(&#x27;is-visible&#x27;, isMobile &amp;&amp; !isActive);
        mobileDialog.classList.toggle(&#x27;is-visible&#x27;, isMobile &amp;&amp; isActive);

        const stateLabel = isEmptyHistory
          ? (isMobile ? &#x27;Mobil · tom historikk&#x27; : &#x27;Full tomtilstand&#x27;)
          : isMobile
          ? (isActive ? &#x27;Mobil · aktiv samtale&#x27; : &#x27;Mobil · oversikt&#x27;)
          : (isActive ? &#x27;Adaptiv delt flate · kompakt modus&#x27; : &#x27;Full oversikt&#x27;);
        const patternLabel = isEmptyHistory
          ? &#x27;ingen samtaler&#x27;
          : !isMobile &amp;&amp; !isActive
          ? &#x27;datokolonne&#x27;
          : &#x27;dato først · gjentatt dato utelatt&#x27;;
        const densityLabel = isEmptyHistory
          ? &#x27;tydelig vei til første samtale&#x27;
          : !isMobile &amp;&amp; !isActive ? &#x27;tittel + én linje&#x27; : &#x27;tittel alene&#x27;;
        modeNote.textContent = `${stateLabel} · ${patternLabel} · ${densityLabel}`;
      }

      desktopButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        viewport = &#x27;desktop&#x27;;
        render();
      });

      mobileButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        viewport = &#x27;mobile&#x27;;
        render();
      });

      overviewButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        state = &#x27;overview&#x27;;
        isNew = false;
        render();
      });

      activeButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        state = &#x27;active&#x27;;
        isNew = false;
        render();
      });

      emptyButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        state = &#x27;empty&#x27;;
        isNew = false;
        render();
      });

      root.querySelectorAll(&#x27;.conversation-item&#x27;).forEach((item) =&gt; {
        item.addEventListener(&#x27;click&#x27;, () =&gt; {
          selected = item.dataset.conversation;
          state = &#x27;active&#x27;;
          isNew = false;
          render();
        });
      });

      root.querySelector(&#x27;.mobile-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        state = &#x27;overview&#x27;;
        render();
        const selectedItem = root.querySelector(`.mobile-list [data-conversation=&quot;${selected}&quot;]`);
        if (selectedItem) selectedItem.focus({ preventScroll: true });
      });

      root.querySelectorAll(&#x27;.new-conversation&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          state = &#x27;active&#x27;;
          isNew = true;
          render();
        });
      });

      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
