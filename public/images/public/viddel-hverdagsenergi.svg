<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 734" role="img" aria-labelledby="title desc">
  <title id="title">Hverdagsenergi</title>
  <desc id="desc">Abstrakt komposisjon med blå himmel, varmt lys og transparente gule og oransje flater i bevegelse.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68B9E9"/>
      <stop offset="0.6" stop-color="#BFE5F7"/>
      <stop offset="1" stop-color="#F7F0D5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD85A" stop-opacity="0.88"/>
      <stop offset="0.55" stop-color="#F7B52E" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#F27935" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCE45" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#EA6C31" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
